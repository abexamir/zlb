# Temporary traffic canary; delete both objects after verification.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zlb-nat-canary
  namespace: zlb-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zlb-nat-canary
  template:
    metadata:
      labels:
        app: zlb-nat-canary
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          args: ["--port=8080"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: zlb-nat-canary
  namespace: zlb-system
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: zlb-nat-canary
  ports:
    - name: http
      port: 8080
      targetPort: 8080
