name: Publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
env:
  COSIGN: github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
  GOTOOLCHAIN: auto
jobs:
  validate:
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository] standard local reusable-workflow call
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign signatures
    outputs:
      image: ${{ steps.version.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      chart: ${{ steps.chart.outputs.reference }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve artifact versions
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'SCRIPT'
          import os, pathlib, re, tomllib
          app = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          chart = re.search(r'^version: (.+)$', pathlib.Path('charts/zlb/Chart.yaml').read_text(), re.M)[1]
          owner_repo = os.environ['GITHUB_REPOSITORY'].lower()
          sha = os.environ['GITHUB_SHA']
          release = os.environ['REF_TYPE'] == 'tag'
          if release and os.environ['REF_NAME'] != 'v' + app:
              raise SystemExit('Release tag must match pyproject.toml version')
          chart_version = chart if release else f"{chart}-main.{os.environ['GITHUB_RUN_NUMBER']}.sha.{sha[:12]}"
          image_tag = app if release else 'sha-' + sha
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for k, v in dict(image='ghcr.io/' + owner_repo, chart_registry='oci://ghcr.io/' + owner_repo.split('/')[0] + '/charts', chart_version=chart_version, image_tag=image_tag).items():
                  out.write(f'{k}={v}\n')
          SCRIPT
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - name: Package and publish matching OCI chart
        id: chart
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.version.outputs.image }}
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          CHART_REGISTRY: ${{ steps.version.outputs.chart_registry }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 scripts/package_chart.py --output dist --version "$CHART_VERSION" \
            --image-repository "$IMAGE" --image-tag "$IMAGE_TAG" --image-digest "$IMAGE_DIGEST"
          helm push "dist/zlb-$CHART_VERSION.tgz" "$CHART_REGISTRY" 2>&1 | tee push.log
          chart_digest=$(sed -n 's/^Digest: //p' push.log)
          test -n "$chart_digest"
          echo "reference=${CHART_REGISTRY#oci://}/zlb@$chart_digest" >> "$GITHUB_OUTPUT"
      - name: Sign the image and chart (keyless)
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          CHART: ${{ steps.chart.outputs.reference }}
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          go install "$COSIGN"
          cosign="$(go env GOPATH)/bin/cosign"
          "$cosign" sign --yes "$IMAGE@$IMAGE_DIGEST"
          "$cosign" sign --yes "$CHART"
          {
            echo "### Published artifacts"
            echo "Image: \`$IMAGE@$IMAGE_DIGEST\` (SBOM and provenance attached)"
            echo "Chart: \`oci://${CHART%@*}:$CHART_VERSION\` (\`$CHART\`)"
            echo "Both are signed by this workflow; see CONTRIBUTING.md to verify."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          CHART: ${{ needs.publish.outputs.chart }}
        run: |
          notes=$(printf 'Image: `%s@%s`\nChart: `oci://%s`\n' "$IMAGE" "$DIGEST" "$CHART")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "zlb $TAG" --notes "$notes"
