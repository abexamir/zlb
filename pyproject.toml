[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zlb"
version = "0.5.0"
description = "Static public-IP load balancing through an external load balancer node"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/abexamir/zlb"
Documentation = "https://github.com/abexamir/zlb/tree/main/docs"
Repository = "https://github.com/abexamir/zlb"
Issues = "https://github.com/abexamir/zlb/issues"

[project.scripts]
zlb-controller = "zlb.controller:main"
zlb-natd = "zlb.natd:main"

[tool.setuptools]
packages = ["zlb"]
