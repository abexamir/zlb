apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zlb.fullname" . }}
  labels:
    {{- include "zlb.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "zlb.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "zlb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services, nodes]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [services, services/status]
    verbs: [patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "zlb.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "zlb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" .Release.Namespace (include "zlb.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "zlb.fullname" . }}
    namespace: {{ .Release.Namespace }}
