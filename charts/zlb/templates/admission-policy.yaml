{{- if and .Values.rbac.restrictServiceWrites (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy") }}
# RBAC cannot scope "patch services" to fields. This policy confines the controller's
# Service writes to adding or removing its own cleanup finalizer, so a compromised controller
# cannot redirect traffic by rewriting selectors, ports or other metadata. Status writes use
# the services/status subresource, which cannot change spec or metadata.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "zlb.clusterName" . }}
  labels:
    {{- include "zlb.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [UPDATE]
        resources: [services]
  matchConditions:
    - name: zlb-controller
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" .Release.Namespace (include "zlb.fullname" .) | quote }}
  variables:
    - name: others
      expression: "has(object.metadata.finalizers) ? object.metadata.finalizers.filter(f, f != 'zlb.zarrino.tech/cleanup') : []"
    - name: oldOthers
      expression: "has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers.filter(f, f != 'zlb.zarrino.tech/cleanup') : []"
  validations:
    - expression: "object.spec == oldObject.spec"
      message: zlb controller may not change a Service spec
    - expression: >-
        has(object.metadata.labels) == has(oldObject.metadata.labels) &&
        (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
        has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
        (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations) &&
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
        (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)
      message: zlb controller may not change Service labels, annotations or owners
    - expression: "variables.others == variables.oldOthers"
      message: zlb controller may only add or remove the zlb.zarrino.tech/cleanup finalizer
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "zlb.clusterName" . }}
  labels:
    {{- include "zlb.labels" . | nindent 4 }}
spec:
  policyName: {{ include "zlb.clusterName" . }}
  validationActions: [Deny]
{{- end }}
