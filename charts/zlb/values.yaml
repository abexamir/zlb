# Explicit image and network configuration is required.
nameOverride: ""
fullnameOverride: ""
image:
  repository: ghcr.io/abexamir/zlb
  tag: "0.4.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
lbNode:
  url: ""
  allowPrivateHTTP: false
  existingSecret: ""
  tokenKey: token
  # Optional existing ConfigMap containing the CA that signed the daemon's HTTPS
  # certificate, under ca.crt.
  caConfigMap: ""
  # Optional existing kubernetes.io/tls Secret (tls.crt, tls.key) the controller presents
  # to a daemon that requires client certificates.
  clientCertSecret: ""
nodeCIDR: ""
interval: 5
pools:
  default_pool: public
  blocked_ports: [9808]
  pools:
    - name: public
      ips: [198.51.100.10]
resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    cpu: 250m
    memory: 128Mi
rbac:
  # Install a ValidatingAdmissionPolicy (Kubernetes 1.30+) that limits the controller's
  # Service writes to its own finalizer. Skipped automatically when the API is unavailable.
  restrictServiceWrites: true
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Optional SSH provisioning of a dedicated Debian/Ubuntu VM. A pre-install/pre-upgrade hook
# Job runs it; the controller itself never receives the SSH key.
bootstrap:
  enabled: false
  existingSecret: ""
  # Secret keys: private_key and known_hosts. Host keys are strictly verified.
  sshHost: ""
  sshUser: root
  sshPort: 22
  publicInterface: ""
  publicIPs: []
  # The daemon only forwards to backend ports in this range. Match the cluster's
  # --service-node-port-range.
  backendPortRange: "30000-32767"
  # With an https:// lbNode.url: existing Secret holding the daemon's HTTPS certificate
  # (tls.crt, with an IP SAN for the lbNode.url host) and key (tls.key). Add ca.crt and set
  # requireClientCertificates to make the daemon demand lbNode.clientCertSecret.
  tlsSecret: ""
  requireClientCertificates: false
  # Optional CIDRs allowed to connect to the daemon API, e.g. your node CIDR.
  apiAllowFrom: []
  # The daemon drops new connections arriving on the public interface unless they were
  # DNATed, so the VM cannot be used as a router into the node network. Set true only if
  # this VM must also forward other traffic from its public side.
  allowForeignForwarding: false
  # Drop traffic to the public IPs that is not a listener, a reply or ping, hiding
  # VM-local services such as sshd. Keep false if you administer the VM via a public IP.
  isolatePublicIPs: false
  # Optional cron schedule for a drift-repair CronJob (e.g. "0 * * * *"). Empty runs the
  # bootstrap only on Helm install and upgrade.
  schedule: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 96Mi
